"$schema" = 'https://starship.rs/config-schema.json'
add_newline = true

# claude/statusline.sh の先頭バッジと配色を揃える。ssh 先は赤、ローカルは緑。
# ホスト名が会社指定で WSL かネイティブか見分けにくいため、WSL だけ WSL: を前置する。
format = '${custom.localhost}$all'

[username]
disabled = true

[hostname]
ssh_only = true
ssh_symbol = 'SSH:'
format = '[ $ssh_symbol$hostname ]($style) '
style = 'bold fg:231 bg:160'

[custom.localhost]
when = '[ -z "$SSH_CONNECTION" ]'
command = 'echo "${WSL_DISTRO_NAME:+WSL:}$(hostname -s)"'
format = '[ $output ]($style) '
style = 'bold fg:16 bg:34'
shell = ['sh']

[character]
success_symbol = "[\\$](green bold)"
error_symbol = "[\\$](red bold)"

[directory]
truncation_length = 3

[git_branch]
symbol = ''
format = '\([$symbol$branch(:$remote_branch)]($style)\)'

[git_status]
format = '([$all_status$ahead_behind]($style) )'
conflicted = '='
ahead = '⇡'
behind = '⇣'
diverged = '⇕'
up_to_date = '✓'
untracked = ''
stashed = ''
modified = '🔥'
staged = '+'
renamed = ''
deleted = ''

[package]
disabled = true

[c]
disabled = true

[rust]
disabled = true

[golang]
disabled = true

[python]
disabled = true

[nodejs]
disabled = true

[cmake]
disabled = true

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 440" width="1040" height="440" font-family="'Noto Sans CJK JP','Noto Sans JP',sans-serif" font-size="14">
  <!-- Template for a PR Before/After figure. Copy, then replace names; keep the
       grid: every box that exists in both halves sits at the same x in Before
       and After, so only the change catches the eye. -->
  <title>Before / After: worker が queue を読むようになる</title>
  <style>
    .bg{fill:#ffffff}.t{fill:#1b1f24}.m{fill:#57606a}
    .zone{fill:#f6f8fa;stroke:#8c959f;stroke-width:1.2}
    .box{fill:#ffffff;stroke:#57606a;stroke-width:1.4}
    .new{fill:#dafbe1;stroke:#1a7f37;stroke-width:2}
    .bad{fill:#ffebe9;stroke:#cf222e;stroke-width:2}
    .none{fill:none;stroke:#8c959f;stroke-width:1.2;stroke-dasharray:5 4}
    .ln{stroke:#24292f;stroke-width:1.6;fill:none}
    .lnew{stroke:#1a7f37;stroke-width:2;fill:none}
    .ah{fill:#24292f}.ahn{fill:#1a7f37}
    .sep{stroke:#d0d7de;stroke-width:1}
    .tb{fill:#cf222e}.tg{fill:#1a7f37}
    @media (prefers-color-scheme: dark){
      .bg{fill:#0d1117}.t{fill:#e6edf3}.m{fill:#9198a1}
      .zone{fill:#161b22;stroke:#6e7681}
      .box{fill:#0d1117;stroke:#9198a1}
      .new{fill:#0f2e1a;stroke:#3fb950}
      .bad{fill:#3d1214;stroke:#f85149}
      .none{stroke:#6e7681}
      .ln{stroke:#c9d1d9}.lnew{stroke:#3fb950}
      .ah{fill:#c9d1d9}.ahn{fill:#3fb950}.sep{stroke:#30363d}
      .tb{fill:#f85149}.tg{fill:#3fb950}
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0L10,5L0,10z"/></marker>
    <marker id="n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahn" d="M0,0L10,5L0,10z"/></marker>
  </defs>
  <rect class="bg" x="0" y="0" width="1040" height="440"/>

  <!-- Before: title names the version the reader can check out -->
  <text class="tb" x="20" y="28" font-size="17" font-weight="700">Before(main abc1234)</text>
  <rect class="zone" x="20" y="42" width="380" height="140" rx="8"/>
  <text class="m" x="34" y="64">host A(docker)</text>
  <rect class="zone" x="500" y="42" width="520" height="140" rx="8"/>
  <text class="m" x="514" y="64">host B(systemd)</text>
  <g data-node="b-api"><rect class="box" x="40" y="100" width="140" height="50" rx="6"/><text class="t" x="110" y="130" text-anchor="middle">api</text></g>
  <g data-node="b-q"><rect class="bad" x="230" y="100" width="150" height="50" rx="6"/><text class="t" x="305" y="122" text-anchor="middle">queue</text><text class="m" x="305" y="140" text-anchor="middle" font-size="12">誰も読まない</text></g>
  <g data-node="b-none"><rect class="none" x="540" y="100" width="150" height="50" rx="6"/><text class="m" x="615" y="130" text-anchor="middle">受け手なし</text></g>
  <path class="ln" data-edge="b-api->b-q" d="M180,125H228" marker-end="url(#a)"/>
  <text class="m" x="204" y="92" text-anchor="middle" font-size="12">AMQP :5672</text>

  <line class="sep" x1="20" y1="206" x2="1020" y2="206"/>

  <!-- After: same boxes at the same x; only the change is colored -->
  <text class="tg" x="20" y="238" font-size="17" font-weight="700">After(この PR。緑が足すもの)</text>
  <rect class="zone" x="20" y="252" width="380" height="140" rx="8"/>
  <text class="m" x="34" y="274">host A(docker)</text>
  <rect class="zone" x="500" y="252" width="520" height="140" rx="8"/>
  <text class="m" x="514" y="274">host B(systemd)</text>
  <g data-node="a-api"><rect class="box" x="40" y="310" width="140" height="50" rx="6"/><text class="t" x="110" y="340" text-anchor="middle">api</text></g>
  <g data-node="a-q"><rect class="box" x="230" y="310" width="150" height="50" rx="6"/><text class="t" x="305" y="340" text-anchor="middle">queue</text></g>
  <g data-node="a-w"><rect class="new" x="540" y="310" width="150" height="50" rx="6"/><text class="t" x="615" y="340" text-anchor="middle">worker</text></g>
  <path class="ln" data-edge="a-api->a-q" d="M180,335H228" marker-end="url(#a)"/>
  <text class="m" x="204" y="302" text-anchor="middle" font-size="12">AMQP :5672</text>
  <path class="lnew" data-edge="a-q->a-w" d="M380,335H538" marker-end="url(#n)"/>
  <text class="m" x="460" y="326" text-anchor="middle" font-size="12">AMQP :5672</text>

  <!-- Notes: facts the boxes cannot carry, 1-3 lines -->
  <text class="m" x="20" y="420">worker は起動時に queue へ接続する。WORKER=0 で外すと Before と同じになる。</text>
</svg>

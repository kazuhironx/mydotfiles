# Use ibus "hybrid" key processing (2) instead of the GTK4 default "sync" (1).
#
# Why: with ibus-gtk4 1.5.29 (Ubuntu 24.04) in sync mode, when Mozc empties
# the preedit by Backspace it sends HidePreeditText, but the GTK4 client never
# gets preedit-changed/preedit-end. Ghostty (and any GTK4 app, e.g.
# gnome-text-editor) keeps drawing the last preedit char ("あ") at the cursor
# until Space/Tab. It is display-only (Enter does not insert it) and follows
# focus to other panes. GTK3 apps such as Chrome use async mode (0) and are
# unaffected. The Mozc signals and the Ghostty 1.3.1 preedit handling were
# both verified correct; switching only this mode makes the ghost char go away.
#
# Read by systemd --user at login. Ghostty runs as a D-Bus activated user
# service, so it must be fully quit and restarted after a change.
IBUS_ENABLE_SYNC_MODE=2
